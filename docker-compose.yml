# Production-shaped stack: postgres + pgvector, the API, and the UI as a client.
#   docker compose up --build
#   docker compose exec api python -m app.cli ingest   # first run: index ./corpus
# UI on http://localhost:8501, API docs on http://localhost:8000/docs
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: citewise
      POSTGRES_PASSWORD: citewise
      POSTGRES_DB: citewise
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citewise"]
      interval: 2s
      retries: 20

  api:
    build: .
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      VECTOR_BACKEND: pgvector
      DATABASE_URL: postgresql+psycopg://citewise:citewise@db:5432/citewise
      DATA_DIR: /app/corpus
    volumes: [apidata:/app/data]   # BM25 index + ingest manifest
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}

  ui:
    build: .
    command: streamlit run ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    environment:
      RAG_API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]

volumes:
  pgdata:
  apidata:
