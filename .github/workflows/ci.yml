name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check app ui scripts tests
      - run: pytest -q tests
      - run: python scripts/smoke_test.py

  # Regression gate on the golden set. Needs a GOOGLE_API_KEY repo secret; skipped
  # (not failed) without one, so forks still get a green build.
  eval:
    needs: check
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      DATA_DIR: corpus
    steps:
      - uses: actions/checkout@v4
        if: env.GOOGLE_API_KEY != ''
      - uses: actions/setup-python@v5
        if: env.GOOGLE_API_KEY != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - if: env.GOOGLE_API_KEY != ''
        run: |
          pip install -r requirements.txt
          python -m app.cli ingest
          python -m app.cli eval --retrieval-only --gate
      - uses: actions/upload-artifact@v4
        if: env.GOOGLE_API_KEY != '' && always()
        with:
          name: eval-report
          path: eval/reports/
